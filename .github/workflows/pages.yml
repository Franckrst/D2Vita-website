# Publishes site/ to GitHub Pages (https://franckrst.github.io/D2Vita-website/).
# Repository settings: Pages > Build and deployment > Source = GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      # The site tests hold the bug form against the frozen contract.
      - "contract/schemas/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install test dependencies
        run: npm ci

      - name: Run the site tests
        run: npm test

      - name: Assemble the public files
        run: node scripts/pages-build.mjs ../_site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
